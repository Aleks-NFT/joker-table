  :root{
    --felt:#0B0D0B; --panel:#131316; --panel2:#1B1B20; --line:#26262C;
    --gold:#E8B04B; --cream:#F4EEDE; --muted:#8E887A; --dim:#5E594E;
    --red:#E3354E; --green:#5D8F3A; --felt-green:#2F5D3A;
    --display:'Oswald','Arial Narrow',sans-serif;
    --pixel:'Silkscreen',monospace;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --serif:'Libre Caslon Text',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--felt); color:var(--cream); font-family:var(--serif);
    overflow:hidden;
    background-image:
      radial-gradient(1200px 600px at 50% -12%, rgba(47,93,58,.16), transparent 58%),
      radial-gradient(900px 520px at 50% -2%, rgba(232,176,75,.06), transparent 60%);
    box-shadow:inset 0 0 240px 70px rgba(0,0,0,.7);
  }
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}

  header{
    display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;
    padding:16px 24px 14px;border-bottom:1px solid var(--line);z-index:5;
    background:linear-gradient(180deg,rgba(11,13,11,.9),rgba(11,13,11,.5));
  }
  .eyebrow{font-family:var(--pixel);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  h1{
    font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,52px);
    line-height:.9;letter-spacing:-.01em;text-transform:uppercase;color:var(--cream);
    text-shadow:3px 4px 0 rgba(0,0,0,.6);
  }
  h1 b{color:var(--gold);font-weight:700}
  .counts{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap;padding-bottom:4px}
  .stat{display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
  .stat .n{font-family:var(--display);font-weight:600;font-size:26px;color:var(--cream);line-height:.85}
  .stat .k{font-family:var(--pixel);font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  .stat.hot .n{color:var(--gold)}

  .chips{display:flex;gap:8px;padding:11px 24px;border-bottom:1px solid var(--line);
    z-index:5;flex-wrap:wrap;align-items:center;background:rgba(11,13,11,.6)}
  .chips .lbl{font-family:var(--pixel);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-right:6px}
  .chip{
    font-family:var(--pixel);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
    padding:6px 11px 5px;border:1px solid var(--line);background:transparent;
    color:var(--muted);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:7px;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip[aria-pressed="true"]{color:var(--cream);border-color:var(--dim);background:var(--panel2)}
  .chip:hover{border-color:var(--muted)}
  .chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  #stage{position:relative;flex:1;min-height:0}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas:active{cursor:grabbing}

  .legend{
    position:absolute;left:20px;bottom:18px;background:rgba(11,13,11,.85);
    border:1px solid var(--line);padding:13px 15px;
    font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.75;
    backdrop-filter:blur(4px);max-width:250px;
  }
  .legend .h{font-family:var(--pixel);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  .legend .row{display:flex;align-items:center;gap:9px}
  .legend .sz{display:flex;align-items:flex-end;gap:5px;margin-top:6px}
  .legend .sz i{background:var(--dim);border-radius:50%;display:block}

  #tip{
    position:absolute;pointer-events:none;background:rgba(6,7,6,.96);
    border:1px solid var(--dim);padding:6px 10px;font-family:var(--mono);font-size:11px;
    color:var(--cream);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:10;
    font-variant-numeric:tabular-nums;
  }
  #tip .a{color:var(--gold)}

  #panel{
    position:absolute;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:linear-gradient(180deg,var(--panel),var(--panel2));border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);
    z-index:8;padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;
  }
  #panel.open{transform:translateX(0)}
  #panel .close{position:absolute;top:16px;right:18px;background:none;border:none;
    color:var(--muted);font-size:22px;cursor:pointer;line-height:1;font-family:var(--serif)}
  #panel .close:hover{color:var(--cream)}
  #panel .peyebrow{font-family:var(--pixel);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  #panel .pname{font-family:var(--display);font-weight:600;font-size:24px;text-transform:uppercase;color:var(--cream);padding-right:26px;line-height:1;letter-spacing:.01em}
  #panel .paddr{font-family:var(--mono);font-size:10.5px;color:var(--muted);word-break:break-all}
  #panel .badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--pixel);font-size:8px;letter-spacing:1.5px;
    text-transform:uppercase;padding:5px 9px 4px;border:1px solid var(--line);width:fit-content}
  #panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);overflow:hidden}
  #panel .cell{background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:4px}
  #panel .cell .k{font-family:var(--pixel);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  #panel .cell .v{font-family:var(--mono);font-size:17px;color:var(--cream);font-variant-numeric:tabular-nums}
  #panel .cell .v.pos{color:var(--gold)}
  #panel .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.8}
  #panel .meta b{color:var(--cream);font-weight:500}
  #panel .hint{font-family:var(--serif);font-size:12.5px;font-style:italic;color:var(--dim);margin-top:auto;line-height:1.6}
  #panel .trajwrap{display:flex;flex-direction:column;gap:6px}
  #panel .trajhead{display:flex;justify-content:space-between;align-items:baseline}
  #panel .trajhead .k{font-family:var(--pixel);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  #panel .trajhead .f{font-family:var(--pixel);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
  #panel canvas.traj{width:100%;height:74px;display:block}
  #panel .joker{
    position:relative;border-left:2px solid var(--gold);background:rgba(232,176,75,.05);
    padding:11px 14px 12px 15px;
  }
  #panel .joker .who{font-family:var(--pixel);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  #panel .joker .line{font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.5;color:var(--cream)}
  #pulse{display:flex;align-items:stretch;gap:0;height:66px;border-top:1px solid var(--line);
    background:linear-gradient(180deg,rgba(11,13,11,.5),var(--panel));z-index:5}
  #pulse .pl{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 18px;border-right:1px solid var(--line);min-width:140px}
  #pulse .plk{font-family:var(--pixel);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  #pulse .plsub{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  #pulse canvas{flex:1;min-width:0;height:100%;display:block;cursor:crosshair}
  #pulse .latest{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 18px;
    border-left:1px solid var(--line);min-width:180px;background:none;text-align:left;cursor:pointer}
  #pulse .latest:hover{background:rgba(232,176,75,.05)}
  #pulse .latest:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  #pulse .lk{font-family:var(--pixel);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  #pulse .lv{font-family:var(--mono);font-size:12.5px;color:var(--cream);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

<div id="wrap">
  <header>
    <div>
      <div class="eyebrow"><a href="/" style="color:var(--muted);text-decoration:none">← The Table</a> · Joker Observatory · Uniswap V4 Hooks</div>
      <h1>The <b>Field</b></h1>
    </div>
    <div class="counts" id="counts"></div>
  </header>

  <div class="chips" id="chips"><span class="lbl">Filter</span></div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div class="legend">
      <div class="h">Reading the field</div>
      <div class="row"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)"></span> accelerating — dealing now</div>
      <div class="row"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:var(--green)"></span> steady</div>
      <div class="row"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:var(--red)"></span> cooling</div>
      <div class="row"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:var(--dim)"></span> dormant</div>
      <div class="sz"><i style="width:7px;height:7px"></i><i style="width:12px;height:12px"></i><i style="width:18px;height:18px"></i> <span style="margin-left:3px">size = pools dealt</span></div>
      <div style="margin-top:7px">lines = one hand dealing many</div>
      <div style="margin-top:7px;color:var(--muted)" id="famnote"></div>
    </div>
  </div>

  <div id="pulse">
    <div class="pl"><div class="plk">Live Pulse</div><div class="plsub">Goldsky · 72h · <span id="pltotal">—</span> deals</div></div>
    <canvas id="pulsecv"></canvas>
    <button class="latest" id="latest"><div class="lk">Latest at the table</div><div class="lv" id="latestv">—</div></button>
  </div>
</div>

<aside id="panel" aria-hidden="true">
  <button class="close" id="pclose" aria-label="Close">×</button>
  <div id="pbody"></div>
</aside>

<script>
fetch("data/hook_graph.json?t="+Date.now()).then(r=>r.json()).then(DATA=>{


const C = {gold:"#E8B04B",cream:"#F4EEDE",muted:"#8E887A",dim:"#5E594E",red:"#E3354E",green:"#5D8F3A",line:"#26262C",felt:"#0B0D0B"};
const STATUS = {
  accelerating:{c:C.gold,glow:true,label:"accelerating"},
  steady:{c:C.green,glow:false,label:"steady"},
  cooling:{c:C.red,glow:false,label:"cooling"},
  dormant:{c:C.dim,glow:false,label:"dormant"},
};
const nodes = DATA.nodes.map(n=>({...n}));
const idx = new Map(nodes.map((n,i)=>[n.id,i]));
const links = DATA.links.filter(l=>idx.has(l.source)&&idx.has(l.target)).map(l=>({s:idx.get(l.source),t:idx.get(l.target)}));
const FAMILIES = DATA.families || [];
const famCount = new Map(FAMILIES.map(f=>[f.name,f.count]));
if(FAMILIES.length){
  const fn=document.getElementById("famnote");
  if(fn) fn.innerHTML = "families: " + FAMILIES.map(f=>f.name.replace(/V4Hook$|Hook$/,"")+" ×"+f.count).join(" · ");
}
const maxPools = Math.max(...nodes.map(n=>n.pools));
nodes.forEach(n=>{ n.r = 3.2 + Math.sqrt(n.pools/maxPools)*22; });

const byStatus = {};
nodes.forEach(n=>byStatus[n.status]=(byStatus[n.status]||0)+1);
const counts = document.getElementById("counts");
[["node_count","hooks"],["cluster_count","hands"]].forEach(([k,lab])=>{
  counts.insertAdjacentHTML("beforeend",`<div class="stat"><span class="n">${DATA[k]}</span><span class="k">${lab}</span></div>`);
});
counts.insertAdjacentHTML("beforeend",`<div class="stat hot"><span class="n">${byStatus.accelerating||0}</span><span class="k">accelerating</span></div>`);

const chips = document.getElementById("chips");
let filter="all";
[["all","all",C.cream],["accelerating","accelerating",C.gold],["steady","steady",C.green],["cooling","cooling",C.red],["dormant","dormant",C.dim]].forEach(([id,lab,col])=>{
  const b=document.createElement("button");
  b.className="chip"; b.setAttribute("aria-pressed",id==="all");
  b.innerHTML = id==="all"?`all`:`<span class="dot" style="background:${col}"></span>${lab}`;
  b.onclick=()=>{filter=id;[...chips.querySelectorAll(".chip")].forEach(c=>c.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");};
  chips.appendChild(b);
});
const visible = n => filter==="all"||n.status===filter;

const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W,H,DPR;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); const r=cv.getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener("resize",resize); resize();
nodes.forEach(n=>{ n.x=44+Math.random()*Math.max(1,W-88); n.y=44+Math.random()*Math.max(1,H-88); n.vx=0; n.vy=0; });

let alpha=1;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tick(){
  // сильное отталкивание (распирает газ до стенок) + жёсткая коллизия (без наложений)
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j]; let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy||1; const d=Math.sqrt(d2);
      const minD=a.r+b.r+6; let f=2200/d2*alpha; if(d<minD) f+=(minD-d)*0.20;
      const fx=dx/d*f, fy=dy/d*f; a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    }
  }
  links.forEach(l=>{ const a=nodes[l.s], b=nodes[l.t]; let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-(a.r+b.r+26))*0.02*alpha; const fx=dx/d*f, fy=dy/d*f; a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy; });
  nodes.forEach(n=>{ if(n===drag)return; n.vx*=0.85; n.vy*=0.85; n.x+=n.vx; n.y+=n.vy;
    // СТЕНКИ — контейнер: не дают улететь в углы, газ заполняет коробку до краёв
    const m=42;
    if(n.x<m)n.vx+=(m-n.x)*0.09; else if(n.x>W-m)n.vx-=(n.x-(W-m))*0.09;
    if(n.y<m)n.vy+=(m-n.y)*0.09; else if(n.y>H-m)n.vy-=(n.y-(H-m))*0.09;
    n.x=Math.max(n.r,Math.min(W-n.r,n.x)); n.y=Math.max(n.r,Math.min(H-n.r,n.y)); });
  alpha*=0.996; if(alpha<0.04)alpha=0.04;
}
let hover=null, selected=null, drag=null;
let lastPinged=null; const pings=[]; let pIdx=0;   // Layer 3 state — объявлено до loop(), иначе TDZ
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.lineWidth=1;
  links.forEach(l=>{ const a=nodes[l.s], b=nodes[l.t]; const on=visible(a)||visible(b);
    ctx.strokeStyle=on?"rgba(232,176,75,0.16)":"rgba(120,110,90,0.05)";
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); });
  // круги
  nodes.forEach(n=>{
    const st=STATUS[n.status]||STATUS.dormant; const vis=visible(n);
    ctx.globalAlpha=vis?1:0.12;
    if(st.glow&&vis){ ctx.shadowColor=st.c; ctx.shadowBlur=9+n.r*0.32; } else ctx.shadowBlur=0;  // уже свечение → узлы не сливаются
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,7); ctx.fillStyle=st.c; ctx.fill(); ctx.shadowBlur=0;
    if(n===hover||n===selected){ ctx.lineWidth=2; ctx.strokeStyle=C.cream; ctx.stroke(); }
  });
  ctx.globalAlpha=1;
  // подписи — второй проход, от крупных к мелким, с избеганием коллизий + тень
  ctx.font="600 11px 'IBM Plex Mono',monospace"; ctx.textAlign="center";
  const cands=nodes.filter(n=>visible(n)&&(n.r>14||n===hover||n===selected))
    .sort((a,b)=>((b===hover||b===selected)?1e9:b.pools)-((a===hover||a===selected)?1e9:a.pools));
  const placed=[];
  for(const n of cands){
    const pinned=(n===hover||n===selected);
    const w=ctx.measureText(n.label).width, x=n.x, y=n.y-n.r-7;
    const box=[x-w/2-3,y-12,x+w/2+3,y+3];
    let hit=false; for(const p of placed){ if(!(box[2]<p[0]||box[0]>p[2]||box[3]<p[1]||box[1]>p[3])){hit=true;break;} }
    if(hit && !pinned) continue;
    placed.push(box);
    ctx.shadowColor="rgba(0,0,0,.95)"; ctx.shadowBlur=4;
    ctx.fillStyle=pinned?C.gold:C.cream; ctx.fillText(n.label,x,y);
    ctx.shadowBlur=0;
  }
}
function loop(){ if(!reduce)tick(); draw(); drawPings(); requestAnimationFrame(loop); }
loop();

function nodeAt(x,y){ let best=null,bd=1e9; nodes.forEach(n=>{const d=Math.hypot(n.x-x,n.y-y); if(d<n.r+3&&d<bd&&visible(n)){bd=d;best=n;}}); return best; }
const tip=document.getElementById("tip");
cv.addEventListener("mousemove",e=>{
  const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top;
  if(drag){ drag.x=mx; drag.y=my; drag.vx=0; drag.vy=0; alpha=Math.max(alpha,0.3); return; }
  hover=nodeAt(mx,my);
  if(hover){ tip.style.opacity=1; tip.style.left=(mx+14)+"px"; tip.style.top=(my+12)+"px";
    tip.innerHTML=`<span class="a">${hover.label}</span> · ${hover.pools} pools · accel <span class="a">${hover.accel>0?"+":""}${hover.accel}</span>/d`; cv.style.cursor="pointer";
  } else { tip.style.opacity=0; cv.style.cursor="grab"; }
});
cv.addEventListener("mousedown",e=>{ const r=cv.getBoundingClientRect(); const n=nodeAt(e.clientX-r.left,e.clientY-r.top); if(n)drag=n; });
window.addEventListener("mouseup",()=>{ drag=null; });
cv.addEventListener("click",e=>{ const r=cv.getBoundingClientRect(); const n=nodeAt(e.clientX-r.left,e.clientY-r.top); if(n){ selected=n; openPanel(n); } });

const panel=document.getElementById("panel"), pbody=document.getElementById("pbody");
document.getElementById("pclose").onclick=()=>{ panel.classList.remove("open"); panel.setAttribute("aria-hidden","true"); selected=null; };
// сколько сидений держит каждая рука (деплоер) — для реплики про серийность
const depCount = {};
nodes.forEach(n=>{ if(n.deployer) depCount[n.deployer]=(depCount[n.deployer]||0)+1; });

function jokerLine(n){
  if(n.dj) return n.dj;   // настоящая реплика DJ (grok-4.5); шаблон ниже — фолбэк
  const s=n.series||[], p7=s.slice(-7).reduce((a,b)=>a+b,0), pprev=s.slice(-14,-7).reduce((a,b)=>a+b,0);
  const cnt=depCount[n.deployer]||1;
  let base;
  if(n.status==="accelerating" && (p7>=80 || n.accel>15)) base=[
    `Someone sat down heavy this week — ${p7} hands where there were ${pprev}. You feel a run like that in the felt before you ever see the cards.`,
    `The deck caught fire in this seat. ${pprev} deals last week, ${p7} this one. That is not luck. That is a hand with somewhere to be.`];
  else if(n.status==="accelerating") base=[
    `Warming up — dealing quicker than last week and not looking to slow. ${p7} down in seven nights.`,
    `This seat found its rhythm. The hands come faster now than they did.`];
  else if(n.status==="steady") base=[
    `Same tempo, hand after hand. No tell either direction.`,
    `Holds its pace. Nothing in the wrist says the run is turning.`];
  else if(n.status==="cooling") base=[
    `The heat is coming off — ${p7} down this week against ${pprev}. The rush is spent.`,
    `Dealing slower than it was. A table cooling is its own kind of tell.`];
  else if(n.pools>=50) base=[
    `Dealt ${n.pools} and walked. The chips are still on the felt; the hand left the room.`,
    `A heavy stack once. Quiet now — nothing moving this week at all.`];
  else base=[
    `Sat in for a few hands and folded. Nothing moving here now.`,
    `Anted, dealt a little, went cold. Empty in all but name.`];
  let line=base[n.pools % base.length];
  if(n.verified==="no") line+=" And it plays with the deck face down — unverified.";
  if(cnt>=3) line+=` One hand runs ${cnt} of these seats.`;
  return line;
}

function drawTrajectory(cv,series,vel,accel){
  const ctx=cv.getContext("2d"), dpr=Math.min(devicePixelRatio||1,2);
  const w=cv.clientWidth, h=cv.clientHeight; cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const pad=6, bw=w-pad*2, bh=h-pad*2;
  // сглаживание 3д
  const sm=series.map((_,i)=>{ let a=0,c=0; for(let k=-1;k<=1;k++){const j=i+k; if(j>=0&&j<series.length){a+=series[j];c++;}} return a/c; });
  // прогноз 7д: дневной темп vel, наклон accel/7
  const fc=[]; for(let d=1;d<=7;d++) fc.push(Math.max(0, vel + (accel/7)*d));
  const all=sm.concat(fc); const mx=Math.max(1,...all);
  const N=series.length, T=N+fc.length;
  const X=i=>pad+bw*i/(T-1), Y=v=>pad+bh-(v/mx)*bh;
  ctx.clearRect(0,0,w,h);
  // базовая линия
  ctx.strokeStyle="rgba(120,110,90,.18)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad,pad+bh); ctx.lineTo(w-pad,pad+bh); ctx.stroke();
  // сырые бары (тускло)
  ctx.fillStyle="rgba(232,176,75,.14)";
  series.forEach((v,i)=>{ if(v>0){ const x=X(i); ctx.fillRect(x-1, Y(v), 2, pad+bh-Y(v)); } });
  // область под сглаженной историей
  const g=ctx.createLinearGradient(0,pad,0,pad+bh);
  g.addColorStop(0,"rgba(232,176,75,.30)"); g.addColorStop(1,"rgba(232,176,75,0)");
  ctx.beginPath(); ctx.moveTo(X(0),pad+bh);
  sm.forEach((v,i)=>ctx.lineTo(X(i),Y(v))); ctx.lineTo(X(N-1),pad+bh); ctx.closePath();
  ctx.fillStyle=g; ctx.fill();
  // линия истории
  ctx.strokeStyle=C.gold; ctx.lineWidth=1.6; ctx.beginPath();
  sm.forEach((v,i)=>{ const x=X(i),y=Y(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  // прогноз пунктиром
  ctx.setLineDash([3,3]); ctx.strokeStyle="rgba(232,176,75,.7)"; ctx.beginPath();
  ctx.moveTo(X(N-1),Y(sm[N-1]));
  fc.forEach((v,i)=>ctx.lineTo(X(N+i),Y(v))); ctx.stroke(); ctx.setLineDash([]);
  // акцент на последней реальной точке
  ctx.fillStyle=C.cream; ctx.beginPath(); ctx.arc(X(N-1),Y(sm[N-1]),2.6,0,7); ctx.fill();
}

function openPanel(n){
  const st=STATUS[n.status]||STATUS.dormant;
  const ver = n.verified==="yes"?`<span class="badge" style="color:${C.green};border-color:${C.green}">verified</span>`:`<span class="badge" style="color:${C.muted}">unverified</span>`;
  const days=(new Date(n.last)-new Date(n.first))/86400000;
  pbody.innerHTML=`
    <div class="peyebrow">Hook · actor at the table</div>
    <div class="pname">${n.label}</div>
    <div class="paddr">${n.id}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="badge" style="color:${st.c};border-color:${st.c}"><span style="width:8px;height:8px;border-radius:50%;background:${st.c};display:inline-block"></span>${st.label}</span>${ver}
    </div>
    <div class="joker"><div class="who">DJ reads the seat</div><div class="line">${jokerLine(n)}</div></div>
    <div class="grid">
      <div class="cell"><span class="k">Pools dealt</span><span class="v">${n.pools}</span></div>
      <div class="cell"><span class="k">Velocity 7d</span><span class="v">${n.velocity}/d</span></div>
      <div class="cell"><span class="k">Acceleration</span><span class="v ${n.accel>0?"pos":""}">${n.accel>0?"+":""}${n.accel}/d</span></div>
      <div class="cell"><span class="k">Semantics</span><span class="v" style="font-size:13px">${n.sem||"—"}</span></div>
    </div>
    <div class="trajwrap">
      <div class="trajhead"><span class="k">Trajectory · pools/day · ${DATA.series_days}d</span><span class="f">··· projected 7d</span></div>
      <canvas class="traj" id="traj"></canvas>
    </div>
    <div class="meta">${n.family?'One of a family<br><b>'+n.family+'</b> · '+(famCount.get(n.family)||'?')+' seats at the table<br><br>':''}${n.callbacks&&n.callbacks.length?'Callbacks<br><b>'+n.callbacks.join(' · ')+'</b><br><br>':''}Dealt by<br><b>${n.deployer||"—"}</b><br><br>
      At the table <b>${new Date(n.first).toISOString().slice(0,10)}</b> → <b>${new Date(n.last).toISOString().slice(0,10)}</b> · ${Math.round(days)} days</div>
    <div class="hint">A hook is an actor: it deals pools over time. The line is its history; the dotted tail is where its current pace points.</div>`;
  panel.classList.add("open"); panel.setAttribute("aria-hidden","false");
  requestAnimationFrame(()=>{ const tc=document.getElementById("traj"); if(tc) drawTrajectory(tc, n.series||[], n.velocity, n.accel); });
}

// ===== Layer 3 — Live Pulse (Goldsky stream) =====
const PULSE = DATA.pulse || {bins:[],recent:[],total:0};
document.getElementById("pltotal").textContent = PULSE.total||0;
const pulseEvents = (PULSE.recent||[]).filter(e=>e.inGraph && idx.has(e.hook))
  .map(e=>({label:e.label, ts:e.ts, node:nodes[idx.get(e.hook)]})).filter(e=>e.node);
const pcv=document.getElementById("pulsecv"), pctx=pcv.getContext("2d");
function drawPulse(){
  const dpr=Math.min(devicePixelRatio||1,2); const r=pcv.getBoundingClientRect(); const PW=r.width, PH=r.height;
  pcv.width=PW*dpr; pcv.height=PH*dpr; pctx.setTransform(dpr,0,0,dpr,0,0);
  const bins=PULSE.bins||[]; const n=bins.length; if(!n){return;} const mx=Math.max(1,...bins);
  const pad=9, w=PW-pad*2, h=PH-pad*2;
  const X=i=>pad+w*i/(n-1), Y=v=>pad+h-(v/mx)*h;
  pctx.clearRect(0,0,PW,PH);
  pctx.strokeStyle="rgba(120,110,90,.15)"; pctx.lineWidth=1; pctx.beginPath(); pctx.moveTo(pad,pad+h); pctx.lineTo(PW-pad,pad+h); pctx.stroke();
  const g=pctx.createLinearGradient(0,pad,0,pad+h); g.addColorStop(0,"rgba(232,176,75,.28)"); g.addColorStop(1,"rgba(232,176,75,0)");
  pctx.beginPath(); pctx.moveTo(X(0),pad+h); bins.forEach((v,i)=>pctx.lineTo(X(i),Y(v))); pctx.lineTo(X(n-1),pad+h); pctx.closePath(); pctx.fillStyle=g; pctx.fill();
  pctx.strokeStyle=C.gold; pctx.lineWidth=1.4; pctx.beginPath(); bins.forEach((v,i)=>{const x=X(i),y=Y(v); i?pctx.lineTo(x,y):pctx.moveTo(x,y);}); pctx.stroke();
  pctx.fillStyle=C.cream; pctx.beginPath(); pctx.arc(X(n-1),Y(bins[n-1]||0),2.4,0,7); pctx.fill();
}
window.addEventListener("resize",drawPulse); drawPulse();

function emitPing(){
  if(!pulseEvents.length) return;
  const e=pulseEvents[pIdx % pulseEvents.length]; pIdx++;
  pings.push({node:e.node, t0:performance.now()}); lastPinged=e.node;
  document.getElementById("latestv").textContent = `${e.node.label} · ${e.node.pools} pools dealt`;
}
function drawPings(){
  const now=performance.now();
  for(let i=pings.length-1;i>=0;i--){
    const p=pings[i], age=(now-p.t0)/1400;
    if(age>1){ pings.splice(i,1); continue; }
    ctx.strokeStyle=`rgba(232,176,75,${(1-age)*0.6})`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(p.node.x,p.node.y,p.node.r+age*26,0,7); ctx.stroke();
  }
}
if(!reduce) setInterval(emitPing, 2200);
emitPing();
document.getElementById("latest").onclick=()=>{ if(lastPinged){ selected=lastPinged; openPanel(lastPinged); } };

}).catch(e=>{document.getElementById("stage").innerHTML='<div style="padding:40px;font-family:var(--mono);color:var(--muted)">Field data unavailable</div>';});
</script>
